ToggleHotkey: "Key that switches the affected tamed creatures between fighting and passive."
StartPassive: "Default is off, so every tame fights normally until you press the hotkey."
ScanInterval: "Seconds between checks for newly tamed or newly loaded creatures. 1 is plenty; raise it for very crowded bases."
MaxDistance: "Calm radius (m): draws a circle around you. 0 = no limit, every tamed animal stays peaceful. A number = only animals inside the circle stay peaceful; they start fighting again once they walk out. Only works while calm mode is on (F9 by default)."
AffectVanilla: "Affect the game's own tameable animals: boar, wolf, lox, chicken and asksvin."
CustomPrefabs: "For animals added by other mods: prefab names, comma separated. Find the name in the mod's README or its translation file, or try 'spawn <name>' in the console. Examples: MidgardBear_Polar (polar bear), MidgardBear (brown bear)."
OnlyPrefabs: "Optional strict whitelist. When set, ONLY these are affected and the switches above are ignored."
NeverPrefabs: "Comma separated prefab names that are never affected, even if they are named above. Example: Wolf,Wolf_cub"
LogPerformance: "Every 60 scans, write the average and worst scan time to the BepInEx log."
HudShow: "Show the calm panel at the left edge while calm mode is on."
HudX: "Panel distance from the left edge, in percent of screen width."
HudY: "Panel distance from the top edge, in percent of screen height."
HudFont: "Panel text size in pixels."
HudPrefabNames: "Show raw prefab names instead of translated creature names."
MsgOn: "Tames: passive now ({0})"
MsgOff: "Tames: fighting again"
HudTitle: "Calm {0}"
FollowDistance: "How close (m) a following tame may get before it stops. 3 = the game's own behaviour (it walks into your lap); larger numbers keep the pack further away. Always on, no hotkey."
ChaseRange: "Give up a fight when the target is further than this (m) away from you. 0 = the game's own behaviour. Not used while calm mode is on, since nothing fights then."
IgnoreTargets: "Prefab names these tames never treat as enemies, comma separated, e.g. Deer,Boar,Rabbit. Empty = the game's own behaviour."
IgnoreTamingTargets: "Never attack a wild creature that can still be tamed, so the pack stops killing the boar or wolf you are taming."
AssistOnly: "Only fight back against something that is already attacking you or one of your tames. Off = the pack picks its own fights."

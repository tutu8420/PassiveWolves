ToggleHotkey: "切换热键：把受影响的驯服生物在“会攻击”和“不攻击”之间来回切换。"
StartPassive: "默认关闭 = 所有驯服生物正常攻击，只有按热键后才进入被动。开启它 = 一进游戏就已经是“不攻击”状态。"
ScanInterval: "扫描间隔（秒）：每隔多久检查一次新驯服或新加载的生物。1 秒足够，基地动物特别多可以调到 2。"
MaxDistance: "宁静范围（米）：以你为中心画一个圈。填 0 = 不限制，所有被驯服的动物都不会主动攻击；填数字 = 只有圈内的动物保持安静，走出圈外会重新开始攻击。注意：这个范围只在“宁静模式”打开时才起作用（默认按 F9 开启）。"
AffectVanilla: "影响原版动物：野猪、狼、甲龙、鸡、阿斯克维。"
CustomPrefabs: "这里是给“其他模组添加的动物”用的：填写预制体名，逗号分隔。名字可以在模组 README 或本地化文件里找到，也可以用控制台 spawn <名字> 试。例如 MidgardBear_Polar（北极熊）、MidgardBear（棕熊）。"
OnlyPrefabs: "可选的白名单：填了之后只影响名单里的生物，上面的开关都不再起作用。"
NeverPrefabs: "永不影响的生物：逗号分隔，即使上面写了也会被排除。例如 Wolf,Wolf_cub。"
LogPerformance: "性能日志：每 60 次扫描往 BepInEx 日志里写一次平均和最慢耗时。"
HudShow: "在宁静模式开启时，于屏幕左侧显示受影响的生物列表。"
HudX: "面板距屏幕左边的距离，单位是屏宽的百分比。"
HudY: "面板距屏幕顶部的距离，单位是屏高的百分比。"
HudFont: "面板文字大小（像素）。"
HudPrefabNames: "显示原始预制体名，而不是翻译后的生物名（调试用）。"
MsgOn: "驯服生物：停止攻击（{0} 只）"
MsgOff: "驯服生物：恢复攻击"
HudTitle: "宁静领域 · {0}"
FollowDistance: "跟随距离（米）：跟随中的动物离你小于这个距离就停下。3 = 游戏原版行为（几乎贴脸）；调大 = 狼群保持距离。常驻生效，不需要热键。"
ChaseRange: "追击范围（米）：目标离你超过这个距离就放弃战斗。0 = 游戏原版行为。注意：宁静模式打开时该项不生效（那时全体已经不攻击了）。"
IgnoreTargets: "无视名单：这些预制体名，驯服生物永远不当成敌人，逗号分隔，例如 Deer,Boar,Rabbit。留空 = 游戏原版行为。"
IgnoreTamingTargets: "不打可驯服生物：野生的、驯服还没完成的生物一律不打，避免狼群把你正在驯服的野猪或狼咬死。"
AssistOnly: "只还手：只有对方已经在打你或你的动物时才反击。关闭 = 狼群自己挑目标开团。"
